# DreamerV3 on Deathmatch with a 3-stage bot-count curriculum (2 -> 4 -> 8).
#
# Pair with ``configs/dreamer_deathmatch.yaml`` (the fixed 4-bot baseline)
# so a notebook or matrix run produces a "curriculum" and a "baseline"
# directory side-by-side under
# ``training_jobs/deathmatch/dreamer/runs/``. Identical hyperparameters
# keep the comparison apples-to-apples; the only difference is the
# ``curriculum:`` block at the bottom of this file.
#
# See ``dreamer_deadly_corridor_curriculum.yaml`` for the world-model
# caveat about RSSM dynamics churn after each promotion.

scenario: deathmatch
algorithm: dreamer
seed: 42

env:
  # n_envs is intentionally NOT exposed for dreamer — the upstream port
  # trains single-env and its train_ratio is calibrated for that.
  resize_shape: [64, 64]
  frame_skip: 4
  grayscale: false
  doom_skill: 3                 # monster-AI setting; bots don't use it,
                                # but recorded for parity with the
                                # baseline / skill-curriculum runs.
  # num_bots is deliberately unset: the curriculum's first stage
  # (num_bots=2) is applied at training start via the controller.

hyperparams:
  preset: atari100k
  batch_size: 16
  batch_length: 64
  train_ratio: 512
  imag_horizon: 20              # longer horizon for navigation planning

training:
  # Matched to dreamer_deathmatch.yaml (the baseline arm) so the matrix
  # comparison isolates the curriculum. The bot-count ramp gives the world
  # model two difficulty boundaries to relearn, which is why this is above
  # Dreamer's usual budget; the baseline was raised to match.
  total_timesteps: 1500000
  checkpoint_freq: 150000

eval:
  eval_freq: 50000
  n_episodes: 5

# Bot-count curriculum.
#
# Thresholds mirror the PPO-curriculum YAML — eval reward on deathmatch
# tracks frags per episode (KILLCOUNT delta). See BENCHMARKS.md for the
# frag bands used to pick these thresholds.
#
# min_evals_between_promotions=2 avoids jumping stages on a single
# lucky eval; the controller requires at least two eval windows above
# threshold before promoting.
curriculum:
  enabled: true
  min_evals_between_promotions: 2
  sync_eval_env: true
  stages:
    - {num_bots: 2, promote_at: 3.0}
    - {num_bots: 4, promote_at: 5.0}
    - {num_bots: 8, promote_at: null}   # terminal stage
