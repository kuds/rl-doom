# Hyperparameters for Recurrent PPO (sb3-contrib, CnnLstmPolicy) on Deadly Corridor.
# Paired with configs/ppo_deadly_corridor.yaml. The LSTM helps the agent remember
# enemies that briefly leave its 84x84 field of view as it advances down the
# corridor — a known weak spot for stacked-frames PPO on this scenario.

scenario: deadly_corridor
algorithm: recurrent_ppo
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 8
  doom_skill: 3
  num_bots: 0

hyperparams:
  lr: 2.5e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.05            # matches ppo_deadly_corridor — same exploration
                                # pressure to fight entropy collapse on this
                                # sparse, death-penalty-dominated scenario
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 2500000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10
  # Stop once this many consecutive evals pass without a new best, so a run
  # that has plateaued stops burning compute. Patience resets on a curriculum
  # promotion (a harder rung legitimately scores lower). EvalCallback keeps the
  # best checkpoint either way, so this only skips steps.
  #
  # Calibrated against the 2026-04 runs, which all peaked early and then
  # declined: DQN/deadly_corridor best @ 400k of 2.5M then -40%;
  # PPO/deathmatch best @ 250k of 2.5M then -14%. At these eval_freq values a
  # patience of 20 would have ended both around 40% of budget while leaving
  # PPO/deadly_corridor (peak @ 1.675M) untouched.
  # Set to null to always train the full budget.
  early_stop_patience: 20
  early_stop_min_evals: 10
policy:
  features_dim: 512
  net_arch: []
  lstm_hidden_size: 256
  n_lstm_layers: 1
