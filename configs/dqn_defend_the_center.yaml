# Hyperparameters for DQN (stable-baselines3, CnnPolicy) on Defend the Center.
# Paired with configs/ppo_defend_the_center.yaml for same-scenario algorithm comparison.
# Buffer is scaled up vs. dqn_basic.yaml to account for the longer survival horizon.

scenario: defend_the_center
algorithm: dqn
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 1
  doom_skill: 3                 # ViZDoom difficulty (1..5); 3 = "Hurt me plenty"
  num_bots: 0                   # ZDoom AI bots via addbot (deathmatch-only)

hyperparams:
  lr: 1.0e-4
  buffer_size: 200000
  learning_starts: 10000
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.3
  eps_start: 1.0
  eps_end: 0.05
  max_grad_norm: 10.0

training:
  total_timesteps: 500000
  checkpoint_freq: 100000

eval:
  eval_freq: 20000
  n_episodes: 30
