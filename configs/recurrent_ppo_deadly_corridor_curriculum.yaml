# Recurrent PPO on Deadly Corridor with the same skill curriculum used
# by the PPO variant (configs/ppo_deadly_corridor_curriculum.yaml).
# Pair with ``configs/recurrent_ppo_deadly_corridor.yaml`` for a
# baseline comparison.

scenario: deadly_corridor
algorithm: recurrent_ppo
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 8
  num_bots: 0

hyperparams:
  lr: 2.5e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.05
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 2000000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10

policy:
  features_dim: 512
  net_arch: []
  lstm_hidden_size: 256
  n_lstm_layers: 1

curriculum:
  enabled: true
  min_evals_between_promotions: 2
  sync_eval_env: true
  stages:
    - {skill: 1, promote_at: 40.0}
    - {skill: 2, promote_at: 60.0}
    - {skill: 3, promote_at: null}
