# DQN on Deathmatch with a 3-stage bot-count curriculum (2 -> 4 -> 8).
#
# Pair with ``configs/dqn_deathmatch.yaml`` (the fixed 4-bot baseline).
# DQN with a single worker has a harder time than PPO on deathmatch —
# sparse rewards, long horizons, and no parallel envs — so the
# curriculum is the same 2 -> 4 -> 8 bot ramp. See the PPO curriculum
# YAML for the rationale.

scenario: deathmatch
algorithm: dqn
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 1                     # SB3 DQN supports n_envs=1 only
  doom_skill: 3
  # num_bots deliberately unset — first stage (num_bots=2) applied at
  # training start via SkillCurriculumCallback.

hyperparams:
  lr: 1.0e-4
  buffer_size: 300000
  learning_starts: 20000
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.3
  eps_start: 1.0
  eps_end: 0.05
  max_grad_norm: 10.0

training:
  total_timesteps: 3000000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10

policy:
  features_dim: 512
  net_arch: []

# Bot-count curriculum. DQN uses the same raw-reward thresholds as
# PPO/RPPO (no VecNormalize reward scaling for either at eval time).
curriculum:
  enabled: true
  min_evals_between_promotions: 2
  sync_eval_env: true
  stages:
    - {num_bots: 2, promote_at: 3.0}
    - {num_bots: 4, promote_at: 5.0}
    - {num_bots: 8, promote_at: null}
