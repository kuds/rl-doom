# DQN on Deadly Corridor with a 3-stage skill curriculum (1 -> 2 -> 3).
#
# Pair with ``configs/dqn_deadly_corridor.yaml`` (the fixed-skill-3
# baseline). DQN with a single worker struggles more than PPO on this
# scenario: sparse rewards, long horizon, and no n-step returns. The
# curriculum gives the Q-estimator a survivable early regime so TD
# targets stop being dominated by the death penalty.

scenario: deadly_corridor
algorithm: dqn
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 1
  num_bots: 0

hyperparams:
  lr: 1.0e-4
  buffer_size: 200000
  learning_starts: 10000
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.3
  eps_start: 1.0
  eps_end: 0.05
  max_grad_norm: 10.0

training:
  total_timesteps: 3000000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10

policy:
  features_dim: 512
  net_arch: []

# DQN uses the same raw-reward thresholds as PPO/RPPO (1500). DQN never
# applies VecNormalize reward scaling, and the EvalCallback reward is
# unscaled for PPO/RPPO too, so the scales line up.
curriculum:
  enabled: true
  min_evals_between_promotions: 2
  sync_eval_env: true
  stages:
    - {skill: 1, promote_at: 1500.0}
    - {skill: 2, promote_at: 1500.0}
    - {skill: 3, promote_at: null}
