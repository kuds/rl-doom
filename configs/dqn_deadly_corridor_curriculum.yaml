# DQN on Deadly Corridor with a 3-stage skill curriculum (1 -> 2 -> 3).
#
# Pair with ``configs/dqn_deadly_corridor.yaml`` (the fixed-skill-3
# baseline). DQN with a single worker struggles more than PPO on this
# scenario: sparse rewards, long horizon, and no n-step returns. The
# curriculum gives the Q-estimator a survivable early regime so TD
# targets stop being dominated by the death penalty.

scenario: deadly_corridor
algorithm: dqn
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 1
  num_bots: 0

hyperparams:
  lr: 1.0e-4
  # Replay cost is buffer_size x 4x84x84 bytes x2 (SB3 keeps obs and next_obs
  # as separate arrays) = 10.5 GiB here. Sized for the NVIDIA L4 Colab
  # runtime these experiments actually use (~53 GiB system RAM); the April
  # runs completed at this size.
  #
  # optimize_memory_usage=True would halve it, but SB3 rejects that together
  # with handle_timeout_termination, which the pipeline needs for correct
  # value targets on scenario timeouts.
  #
  # On a smaller machine, lower this: rl_doom.sb3_utils checks the estimate
  # against real available RAM at startup and fails fast with the size that
  # would fit, rather than OOMing mid-run.
  buffer_size: 200000
  learning_starts: 10000
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.3
  eps_start: 1.0
  eps_end: 0.05
  max_grad_norm: 10.0

training:
  total_timesteps: 2500000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10
  # Stop once this many consecutive evals pass without a new best, so a run
  # that has plateaued stops burning compute. Patience resets on a curriculum
  # promotion (a harder rung legitimately scores lower). EvalCallback keeps the
  # best checkpoint either way, so this only skips steps.
  #
  # Calibrated against the 2026-04 runs, which all peaked early and then
  # declined: DQN/deadly_corridor best @ 400k of 2.5M then -40%;
  # PPO/deathmatch best @ 250k of 2.5M then -14%. At these eval_freq values a
  # patience of 20 would have ended both around 40% of budget while leaving
  # PPO/deadly_corridor (peak @ 1.675M) untouched.
  # Set to null to always train the full budget.
  early_stop_patience: 20
  early_stop_min_evals: 10
policy:
  features_dim: 512
  net_arch: []

# DQN uses the same raw-reward thresholds as PPO/RPPO (1500). DQN never
# applies VecNormalize reward scaling, and the EvalCallback reward is
# unscaled for PPO/RPPO too, so the scales line up.
curriculum:
  enabled: true
  min_evals_between_promotions: 2
  sync_eval_env: true
  stages:
    - {skill: 1, promote_at: 1500.0}
    - {skill: 2, promote_at: 1500.0}
    - {skill: 3, promote_at: null}
