# Hyperparameters for DQN (stable-baselines3, CnnPolicy) on the Basic scenario.
# Paired with configs/ppo_basic.yaml for same-scenario algorithm comparison.
# Defaults tuned for an L4 GPU + high-memory Colab runtime.

scenario: basic
algorithm: dqn
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 1                     # SB3 DQN requires n_envs=1
  doom_skill: 3                 # ViZDoom difficulty (1..5); 3 = "Hurt me plenty"
  num_bots: 0                   # ZDoom AI bots via addbot (deathmatch-only)

hyperparams:
  lr: 1.0e-4
  # Sized so the replay buffer fits a Colab-class box (~12.7 GiB RAM).
  # SB3 stores obs and next_obs separately, so cost is
  #   buffer_size x 4x84x84 bytes x 2 ~= 2.6 GiB here.
  # optimize_memory_usage=True would halve it, but SB3 rejects that
  # together with handle_timeout_termination, which this pipeline needs
  # for correct value targets on scenario timeouts. Raise this on a
  # bigger machine; rl_doom.sb3_utils checks it against real RAM at
  # startup and fails fast rather than OOMing mid-run.
  buffer_size: 50000
  learning_starts: 10000
  batch_size: 64
  tau: 1.0                      # hard target update
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.3     # anneal epsilon over first 30% of training
  eps_start: 1.0
  eps_end: 0.05
  max_grad_norm: 10.0

training:
  total_timesteps: 500000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10

policy:
  features_dim: 512             # NatureCNN final FC width (SB3 default)
  net_arch: []                  # extra MLP layers after the features extractor
