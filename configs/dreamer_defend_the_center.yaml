# Hyperparameters for DreamerV3 (NM512/dreamerv3-torch) on Defend the Center.
# PoC scenario — see DREAMER_PLAN.md §4. Starts from the port's `atari100k`
# preset (pixel-based, discrete actions) and overrides total steps / image
# size / action repeat for ViZDoom.

scenario: defend_the_center
algorithm: dreamer
seed: 42

env:
  # n_envs is intentionally NOT exposed for dreamer — the upstream port
  # trains single-env and its train_ratio is calibrated for that.
  resize_shape: [64, 64]        # Dreamer default; smaller than DQN/PPO 84x84
  frame_skip: 4                 # action_repeat in dreamerv3-torch terms
  grayscale: false              # Dreamer consumes RGB by default
  doom_skill: 3                 # ViZDoom difficulty (1..5); 3 = "Hurt me plenty"
  num_bots: 0                   # ZDoom AI bots via addbot (deathmatch-only)

hyperparams:
  preset: atari100k             # dreamerv3-torch config preset to inherit
  batch_size: 16
  batch_length: 64
  train_ratio: 512              # replay:env step ratio
  imag_horizon: 15

training:
  total_timesteps: 200000       # matches ppo/dqn_defend_the_center budget
  checkpoint_freq: 50000

eval:
  eval_freq: 10000
  n_episodes: 5
