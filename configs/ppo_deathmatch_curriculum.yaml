# PPO on Deathmatch with a 3-stage bot-count curriculum (2 -> 4 -> 8).
#
# Pair with ``configs/ppo_deathmatch.yaml`` (the fixed 4-bot baseline)
# so each notebook run produces a "curriculum" and a "baseline"
# directory side-by-side under
# ``training_jobs/deathmatch/ppo/runs/``. Identical hyperparameters
# keep the comparison apples-to-apples; the only difference is the
# ``curriculum:`` block at the bottom of this file.
#
# Why a bot-count curriculum on this scenario?
#
# * The deathmatch.wad map has no pre-placed monsters — enemies are
#   ZDoom AI bots added via ``addbot`` on every reset, one per
#   ``num_bots``. At ``num_bots: 0`` the reward signal (KILLCOUNT
#   delta) is identically zero for the entire 2-minute episode.
# * An 8-bot free-for-all is also too sparse for a fresh policy: the
#   agent dies fast against bots with pre-programmed aiming, rarely
#   landing a kill. Starting with 2 bots gives the agent frequent
#   encounters at a tractable difficulty.
# * Once the policy is reliably fragging 2-bot matches, bumping to 4
#   and 8 forces it to generalise (target prioritisation, cover use,
#   weapon switching) without the initial learning cliff.

scenario: deathmatch
algorithm: ppo
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 8
  doom_skill: 3                 # monster-AI setting; bots don't use it,
                                # but it's recorded in config.json for
                                # comparability with the skill curriculum.
  # num_bots is deliberately unset: the curriculum's first stage
  # (num_bots=2) is applied at training start via SkillCurriculumCallback.

hyperparams:
  lr: 2.5e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.03            # matches baseline — keep exploration alive
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 2500000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10
  # Stop once this many consecutive evals pass without a new best, so a run
  # that has plateaued stops burning compute. Patience resets on a curriculum
  # promotion (a harder rung legitimately scores lower). EvalCallback keeps the
  # best checkpoint either way, so this only skips steps.
  #
  # Calibrated against the 2026-04 runs, which all peaked early and then
  # declined: DQN/deadly_corridor best @ 400k of 2.5M then -40%;
  # PPO/deathmatch best @ 250k of 2.5M then -14%. At these eval_freq values a
  # patience of 20 would have ended both around 40% of budget while leaving
  # PPO/deadly_corridor (peak @ 1.675M) untouched.
  # Set to null to always train the full budget.
  early_stop_patience: 20
  early_stop_min_evals: 10
policy:
  features_dim: 512
  net_arch: []

# Bot-count curriculum.
#
# ``promote_at`` is the raw eval mean reward, which for deathmatch
# equals mean frags per episode (the scenario tracks KILLCOUNT delta).
# See BENCHMARKS.md for the frag bands used to pick these thresholds:
# ~2 frags = "learning something", 5-8 = "decent", 10+ = "strong".
#
# Thresholds below the published "decent" band on purpose — we want
# to ramp as soon as the policy is reliably scoring on the current
# rung, not wait until it's fully mastered.
#
# min_evals_between_promotions=2 avoids jumping stages on a single
# lucky eval; the callback requires at least two eval windows above
# threshold before promoting.
# Promotion thresholds are the raw eval mean reward — deathmatch.cfg's shaped
# scenario reward, NOT a frag count. They were 3.0 and 5.0, which read as
# "3 frags" / "5 frags" but sit ~50x below the scale EvalCallback reports, so
# every promotion fired at the earliest allowed eval and the curriculum was a
# no-op: the 2026-04-24 PPO run promoted on eval means of 176.00 (step 50k)
# and 162.00 (step 100k), reaching 8 bots by step 100k of 2,500,000.
#
# Reference points from that run, all on the raw eval scale:
#   eval @ 2 bots, step 50k (barely trained):  176.00
#   eval @ 4 bots, step 100k:                  162.00
#   best eval over the whole run (8 bots):     193.90
#   final eval (8 bots):                       166.50
#
# The bar has to clear ~176 to mean anything. 220/200 demands real improvement
# over an untrained policy while staying inside the range this algorithm has
# been observed to reach; the 4-bot bar is lower because the rung is harder.
#
# PROVISIONAL: calibrating these properly needs fixed-2-bot and fixed-4-bot
# baseline runs to establish what "competent at this rung" scores, and no such
# run exists yet. After the next run, check metrics/curriculum.json — if
# promotions still fire at the earliest allowed eval, raise them again.
curriculum:
  enabled: true
  min_evals_between_promotions: 2
  sync_eval_env: true
  stages:
    - {num_bots: 2, promote_at: 220.0}
    - {num_bots: 4, promote_at: 200.0}
    - {num_bots: 8, promote_at: null}   # terminal stage
