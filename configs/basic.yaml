# Hyperparameters for Double DQN on the Basic scenario.
# Consumed by notebooks/02_dqn_training.ipynb and future train.py.

scenario: basic
algorithm: dqn

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4

agent:
  lr: 1.0e-4
  gamma: 0.99

replay_buffer:
  capacity: 50000
  warmup_steps: 1000

training:
  total_steps: 100000
  batch_size: 32
  target_update_interval: 1000
  train_every: 4
  seed: 0

exploration:
  epsilon_start: 1.0
  epsilon_end: 0.05
  epsilon_decay_steps: 50000

eval:
  n_episodes: 10
  eval_every: 10000
