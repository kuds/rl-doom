# Hyperparameters for DQN (stable-baselines3, CnnPolicy) on Deadly Corridor.
# Paired with configs/ppo_deadly_corridor.yaml for same-scenario algorithm comparison.
# Buffer is scaled up vs. dqn_basic.yaml to account for the longer horizon
# and sparser reward.

scenario: deadly_corridor
algorithm: dqn
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 1
  # Ultra-Violence: keeps the gauntlet's finite-horizon structure intact
  # while making imps more aggressive. Nightmare (5) would add monster
  # respawn, which breaks credit assignment for DQN/PPO.
  doom_skill: 4

hyperparams:
  lr: 1.0e-4
  buffer_size: 200000
  learning_starts: 10000
  batch_size: 64
  tau: 1.0
  gamma: 0.99
  train_freq: 4
  gradient_steps: 1
  target_update_interval: 1000
  exploration_fraction: 0.3
  eps_start: 1.0
  eps_end: 0.05
  max_grad_norm: 10.0

training:
  total_timesteps: 500000
  checkpoint_freq: 100000

eval:
  eval_freq: 20000
  n_episodes: 10
