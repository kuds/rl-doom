# Hyperparameters for PPO (stable-baselines3, CnnPolicy) on Deadly Corridor.
# Paired with configs/dqn_deadly_corridor.yaml for same-scenario algorithm comparison.
# entropy_coef is raised vs ppo_basic to fight early entropy collapse on this
# sparse, death-penalty-dominated scenario.

scenario: deadly_corridor
algorithm: ppo
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 8

hyperparams:
  lr: 2.5e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.05
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 1000000
  checkpoint_freq: 100000

eval:
  eval_freq: 25000
  n_episodes: 10
