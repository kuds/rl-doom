# Hyperparameters for PPO (stable-baselines3, CnnPolicy) on the Basic scenario.
# Paired with configs/dqn_basic.yaml for same-scenario algorithm comparison.
# Defaults tuned for an L4 GPU + high-memory Colab runtime.

scenario: basic
algorithm: ppo
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 8                     # DummyVecEnv (no subprocesses on Colab)
  doom_skill: 3                 # ViZDoom difficulty (1..5); 3 = "Hurt me plenty"
  num_bots: 0                   # ZDoom AI bots via addbot (deathmatch-only)

hyperparams:
  lr: 2.5e-4
  n_steps: 1024                 # per env => 8 * 1024 = 8192 samples / rollout
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.01
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 500000
  checkpoint_freq: 100000

eval:
  eval_freq: 25000
  n_episodes: 30

policy:
  features_dim: 512             # NatureCNN final FC width (SB3 default)
  net_arch: []                  # extra MLP layers after the features extractor
