# Hyperparameters for DreamerV3 (NM512/dreamerv3-torch) on Deadly Corridor.
# This is the scenario where Dreamer's RSSM should outshine PPO's frame
# stacking — long corridor, enemies leaving FOV, sparse reward. We bump
# the imagination horizon slightly to let the agent plan further ahead
# than the atari100k default (15 -> 20). See DREAMER_PLAN.md §4 / §6.

scenario: deadly_corridor
algorithm: dreamer
seed: 42

env:
  # n_envs is intentionally NOT exposed for dreamer — the upstream port
  # trains single-env and its train_ratio is calibrated for that.
  resize_shape: [64, 64]
  frame_skip: 4
  grayscale: false
  doom_skill: 3
  num_bots: 0

hyperparams:
  preset: atari100k
  batch_size: 16
  batch_length: 64
  train_ratio: 512
  imag_horizon: 20              # longer horizon — corridor needs lookahead

training:
  # Matched to dreamer_deadly_corridor_curriculum.yaml. The matrix in
  # configs/matrix/deadly_corridor_curriculum.yaml runs these two against each
  # other to answer "does the skill curriculum help?", which only measures the
  # curriculum if both arms get the same budget — otherwise it measures
  # compute. This was 500k against the curriculum arm's 1M.
  #
  # Levelled up rather than down: the curriculum arm's budget was chosen
  # deliberately (the world model needs time to relearn dynamics after each
  # skill flip), and a baseline with the same compute is the stronger, more
  # conservative comparison. Still well under PPO/DQN/RPPO's 2.5M, since
  # Dreamer is more sample-efficient in this regime.
  total_timesteps: 1000000
  checkpoint_freq: 100000

eval:
  eval_freq: 25000
  n_episodes: 5
