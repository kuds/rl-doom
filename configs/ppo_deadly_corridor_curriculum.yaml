# PPO on Deadly Corridor with a 3-stage skill curriculum (1 -> 2 -> 3).
#
# Pair with ``configs/ppo_deadly_corridor.yaml`` (the fixed-skill-3
# baseline) so each notebook run produces a "curriculum" and a "baseline"
# directory side-by-side under
# ``training_jobs/deadly_corridor/ppo/runs/``. Identical hyperparameters
# keep the comparison apples-to-apples; the only difference is the
# ``curriculum:`` block at the bottom of this file.

scenario: deadly_corridor
algorithm: ppo
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 8
  # doom_skill is deliberately unset: the curriculum's first stage
  # (skill 1) is applied at training start via SkillCurriculumCallback.
  num_bots: 0

hyperparams:
  lr: 2.5e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.05
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 2000000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10

policy:
  features_dim: 512
  net_arch: []

# Skill curriculum.
#
# ``promote_at`` thresholds are intentionally *under* the published
# expert-policy reward for each skill (Deadly Corridor's reward is
# ~2200 for a completed run on skill 3, scaled lower for lower skills
# because VecNormalize rescales returns). The thresholds here reflect
# the point at which the policy is *consistently* surviving past the
# first imp pair — enough prior for the next difficulty to be tractable.
#
# min_evals_between_promotions=2 prevents a single lucky eval from
# jumping a stage; the curriculum waits for at least two eval windows
# above threshold before promoting.
curriculum:
  enabled: true
  min_evals_between_promotions: 2
  sync_eval_env: true
  stages:
    - {skill: 1, promote_at: 40.0}
    - {skill: 2, promote_at: 60.0}
    - {skill: 3, promote_at: null}   # terminal stage
