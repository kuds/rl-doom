# PPO on Deadly Corridor with a 3-stage skill curriculum (1 -> 2 -> 3).
#
# Pair with ``configs/ppo_deadly_corridor.yaml`` (the fixed-skill-3
# baseline) so each notebook run produces a "curriculum" and a "baseline"
# directory side-by-side under
# ``training_jobs/deadly_corridor/ppo/runs/``. Identical hyperparameters
# keep the comparison apples-to-apples; the only difference is the
# ``curriculum:`` block at the bottom of this file.

scenario: deadly_corridor
algorithm: ppo
seed: 42

env:
  resize_shape: [84, 84]
  frame_skip: 4
  num_stack: 4
  n_envs: 8
  # doom_skill is deliberately unset: the curriculum's first stage
  # (skill 1) is applied at training start via SkillCurriculumCallback.
  num_bots: 0

hyperparams:
  lr: 2.5e-4
  n_steps: 1024
  batch_size: 256
  n_epochs: 4
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  entropy_coef: 0.05
  value_coef: 0.5
  max_grad_norm: 0.5

training:
  total_timesteps: 2500000
  checkpoint_freq: 250000

eval:
  eval_freq: 25000
  n_episodes: 10
  # Stop once this many consecutive evals pass without a new best, so a run
  # that has plateaued stops burning compute. Patience resets on a curriculum
  # promotion (a harder rung legitimately scores lower). EvalCallback keeps the
  # best checkpoint either way, so this only skips steps.
  #
  # Calibrated against the 2026-04 runs, which all peaked early and then
  # declined: DQN/deadly_corridor best @ 400k of 2.5M then -40%;
  # PPO/deathmatch best @ 250k of 2.5M then -14%. At these eval_freq values a
  # patience of 20 would have ended both around 40% of budget while leaving
  # PPO/deadly_corridor (peak @ 1.675M) untouched.
  # Set to null to always train the full budget.
  early_stop_patience: 20
  early_stop_min_evals: 10
policy:
  features_dim: 512
  net_arch: []

# Skill curriculum.
#
# ``promote_at`` is the raw eval mean reward (EvalCallback does not
# apply VecNormalize rescaling). The skill-3 baseline hits ~1700–2300
# eval on this scenario when the policy actually completes the corridor,
# so 1500 is the "consistently reaches the vest" bar for the current
# stage before stepping up the difficulty.
#
# min_evals_between_promotions=2 prevents a single lucky eval from
# jumping a stage; the curriculum waits for at least two eval windows
# above threshold before promoting.
curriculum:
  enabled: true
  min_evals_between_promotions: 2
  sync_eval_env: true
  stages:
    - {skill: 1, promote_at: 1500.0}
    - {skill: 2, promote_at: 1500.0}
    - {skill: 3, promote_at: null}   # terminal stage
