name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (without vizdoom binary)
        run: |
          python -m pip install --upgrade pip
          # Install without the vizdoom dependency to avoid needing its
          # native build toolchain in CI. Tests that need vizdoom are
          # skipped when the module isn't importable (see tests/conftest.py).
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install gymnasium numpy opencv-python pyyaml tensorboard matplotlib
          pip install pettingzoo
          pip install pytest ruff mypy
          pip install -e . --no-deps

      - name: Ruff lint
        run: ruff check src tests

      - name: Mypy
        run: mypy

      - name: Pytest
        run: pytest -v
