[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-doom"
version = "0.1.2"
description = "Reinforcement learning agents for Doom using ViZDoom"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "vizdoom>=1.2",
    "gymnasium",
    "torch>=2.0",
    "numpy",
    "opencv-python",
    "pyyaml",
    "tensorboard",
    "matplotlib",
    "stable-baselines3>=2.3",
    "sb3-contrib>=2.3",
    "pettingzoo>=1.24",
    # Lets stable-baselines3 (and rl_doom.sb3_utils.check_replay_buffer_fits)
    # size a DQN replay buffer against real available memory instead of
    # skipping the check. SB3 treats it as optional and silently no-ops the
    # check when it is absent.
    "psutil",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "ipywidgets",
    "pandas",
    "imageio",
    "imageio-ffmpeg",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
]
dreamer = [
    # The DreamerV3 PyTorch port (NM512/dreamerv3-torch) is research code
    # with no setup.py / pyproject.toml, so it cannot be installed as a
    # Python package. The notebook ``git clones`` it and adds the checkout
    # to ``sys.path`` (see ``notebooks/06_dreamer_training.ipynb``). The
    # commit SHA pin lives in ``rl_doom.agents.dreamer.UPSTREAM_PIN`` so
    # the notebook and the agent wrapper can never disagree.
    #
    # The port's ``models.py``, ``networks.py``, ``tools.py``, and
    # ``exploration.py`` only depend on packages already in our base
    # install (``torch``, ``numpy``, ``tensorboard``); we deliberately
    # bypass ``dreamer.py`` (which pulls in ``ruamel.yaml`` + the legacy
    # ``gym`` package via ``envs.wrappers``) by re-implementing its thin
    # ``Dreamer`` nn.Module driver inline in ``rl_doom.agents.dreamer``.
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests", "scripts"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Third-party packages without type stubs. Keeping these as ignore_missing_imports
# rather than installing stub packages keeps the dev install lean.
[[tool.mypy.overrides]]
module = [
    "cv2",
    "gymnasium.*",
    "imageio.*",
    "matplotlib.*",
    "vizdoom",
    "vizdoom.*",
    "google",
    "google.colab",
    "google.colab.*",
    "stable_baselines3",
    "stable_baselines3.*",
    "sb3_contrib",
    "sb3_contrib.*",
    "pettingzoo",
    "pettingzoo.*",
    "psutil",
    "yaml",
]
ignore_missing_imports = true
