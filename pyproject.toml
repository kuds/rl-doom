[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-doom"
version = "0.1.0"
description = "Reinforcement learning agents for Doom using ViZDoom"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "vizdoom>=1.2",
    "gymnasium",
    "torch>=2.0",
    "numpy",
    "opencv-python",
    "pyyaml",
    "tensorboard",
    "matplotlib",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "ipywidgets",
    "pandas",
    "imageio",
    "imageio-ffmpeg",
]
dev = [
    "pytest",
    "ruff",
    "mypy",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

# Third-party packages without type stubs. Keeping these as ignore_missing_imports
# rather than installing stub packages keeps the dev install lean.
[[tool.mypy.overrides]]
module = [
    "cv2",
    "gymnasium.*",
    "imageio.*",
    "matplotlib.*",
    "vizdoom",
    "vizdoom.*",
    "google.colab",
    "google.colab.*",
]
ignore_missing_imports = true
