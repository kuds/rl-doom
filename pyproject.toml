[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-doom"
version = "0.1.0"
description = "Reinforcement learning agents for Doom using ViZDoom"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "vizdoom>=1.2",
    "gymnasium",
    "torch>=2.0",
    "numpy",
    "opencv-python",
    "pyyaml",
    "tensorboard",
    "matplotlib",
]

[project.optional-dependencies]
notebooks = [
    "jupyter",
    "ipywidgets",
    "pandas",
    "imageio",
]
dev = [
    "pytest",
    "ruff",
    "pre-commit",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 99
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
